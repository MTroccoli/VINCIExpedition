<script>
// Codigo compartido por Index y Admin: datos de paises, escape de HTML y el
// manejo de vistas, loading y errores.
// =============================================
// DATOS DE PAISES (banderas y colores)
// =============================================
// iniciativa: titulo que se muestra en la tarjeta de votación.
// iso: codigo ISO-3166 alpha-2 para la bandera. Windows/Chrome no dibuja los
// emoji de bandera (muestra las letras), asi que la bandera va como imagen y
// el emoji queda solo de respaldo para las unidades sin pais (CIB, Holding).
var PAISES_INFO = {
  'Argentina': { iso: 'ar',  emoji: '🇦🇷', color1: '#75AADB', color2: '#FCBF49', iniciativa: 'ALM Desk Dashboard' },
  'Chile':     { iso: 'cl',  emoji: '🇨🇱', color1: '#D52B1E', color2: '#0039A6', iniciativa: 'Iniciativa pendiente de definir' },
  'CIB':       { iso: null,  emoji: '🏦', color1: '#004481', color2: '#1973B8', iniciativa: 'Dashboards Seguimiento Capital' },
  'Colombia':  { iso: 'co',  emoji: '🇨🇴', color1: '#FCD116', color2: '#003893', iniciativa: 'IDP Finance' },
  'Espana':    { iso: 'es',  emoji: '🇪🇸', color1: '#AA151B', color2: '#F1BF00', iniciativa: 'Portal Informacional Contable' },
  'Holding':   { iso: null,  emoji: '🏢', color1: '#072146', color2: '#2DCCCD', iniciativa: 'SDA Navigator' },
  'Mexico':    { iso: 'mx',  emoji: '🇲🇽', color1: '#006847', color2: '#CE1126', iniciativa: 'Modelo de IVA' },
  'Peru':      { iso: 'pe',  emoji: '🇵🇪', color1: '#D91023', color2: '#FFFFFF', iniciativa: 'Gema para el diseño y documentación de controles' },
  'Turquia':   { iso: 'tr',  emoji: '🇹🇷', color1: '#E30A17', color2: '#FFFFFF', iniciativa: 'Iniciativa pendiente de definir' },
  'Uruguay':   { iso: 'uy',  emoji: '🇺🇾', color1: '#001489', color2: '#FCD116', iniciativa: 'GOLDEN' },
  'Venezuela': { iso: 've',  emoji: '🇻🇪', color1: '#CF142B', color2: '#00247D', iniciativa: 'Nexus BBVA Filiales' }
};

// Debe coincidir con CATEGORIAS en Code.gs. Se replica del lado del cliente
// para armar la pantalla sin una llamada mas al servidor: con mil personas
// entrando juntas, cada round trip que se evita cuenta. El backend valida
// igual, asi que esta copia no puede habilitar un voto invalido.
// Los paises que no figuran en CATEGORIAS no se votan: hoy Turquia.
// Bandera como imagen. Si el pais no tiene ISO o la imagen no carga,
// se cae al emoji de la unidad.
function banderaHtml(pais, clase) {
  var info = PAISES_INFO[pais];
  if (!info) return '';
  if (!info.iso) return '<span class="flag-emoji">' + info.emoji + '</span>';
  return '<img class="' + clase + '" src="https://flagcdn.com/w160/' + info.iso + '.png" ' +
         'srcset="https://flagcdn.com/w320/' + info.iso + '.png 2x" ' +
         'alt="' + escHtml(pais) + '" loading="lazy" onerror="this.remove()">';
}

// =============================================
// UTILIDADES
// =============================================
function mostrarVista(id) {
  document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function mostrarLoading(show) {
  document.getElementById('loading').classList.toggle('show', show);
}

function mostrarError(elementId, msg) {
  var el = document.getElementById(elementId);
  el.textContent = msg;
  el.classList.add('show');
}

function ocultarError(elementId) {
  document.getElementById(elementId).classList.remove('show');
}

function escHtml(str) {
  if (!str) return '';
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
