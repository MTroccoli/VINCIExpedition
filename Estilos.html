<style>
/* Estilos compartidos por Index y Admin. Se insertan con incluir_() desde
     cada pagina, asi un cambio de color o de tipografia se hace una sola vez. */

    :root {
      --bbva-dark: #072146;
      --bbva-blue: #004481;
      --bbva-medium: #1973B8;
      --bbva-light: #49A5E6;
      --bbva-aqua: #2DCCCD;
      --bbva-white: #FFFFFF;
      --bbva-bg: #F4F4F4;
      --bbva-gray: #666666;
      --bbva-light-gray: #D3D3D3;
      --bbva-success: #48BB78;
      --bbva-error: #E53E3E;
      --bbva-gold: #F8CD51;
      --shadow: 0 2px 8px rgba(7,33,70,0.10);
      --shadow-lg: 0 8px 24px rgba(7,33,70,0.15);
      --radius: 8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bbva-bg);
      color: var(--bbva-dark);
      min-height: 100vh;
    }

    .header {
      background: linear-gradient(135deg, var(--bbva-dark) 0%, var(--bbva-blue) 100%);
      color: var(--bbva-white);
      padding: 20px 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-lg);
    }
    .header-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 4px;
      margin-bottom: 4px;
    }
    .header-sub {
      font-size: 13px;
      opacity: 0.85;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .header-user {
      display: none;
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.8;
      text-align: right;
      max-width: 40%;
    }
    .header-user.visible { display: block; }
    .header-user strong { display: block; font-size: 13px; opacity: 1; }

    .view { display: none; animation: fadeIn 0.4s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }

    /* ===== PANTALLA REGISTRO ===== */
    .registro-card {
      background: var(--bbva-white);
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      max-width: 480px;
      margin: 60px auto;
      padding: 48px 40px;
      text-align: center;
    }
    .registro-card h2 {
      color: var(--bbva-blue);
      font-size: 24px;
      margin-bottom: 8px;
    }
    .registro-card p {
      color: var(--bbva-gray);
      font-size: 14px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--bbva-dark);
      margin-bottom: 6px;
    }
    .form-group select,
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid var(--bbva-light-gray);
      border-radius: var(--radius);
      font-size: 15px;
      transition: border-color 0.2s;
      outline: none;
      font-family: inherit;
    }
    .form-group select:focus,
    .form-group input:focus {
      border-color: var(--bbva-medium);
    }
    .email-auto {
      background: #EBF8FF;
      border: 1px solid var(--bbva-light);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--bbva-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .email-auto .icon-check { color: var(--bbva-success); font-size: 18px; }

    .btn {
      display: inline-block;
      padding: 14px 40px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .btn-primary {
      background: var(--bbva-blue);
      color: var(--bbva-white);
    }
    .btn-primary:hover { background: var(--bbva-medium); }
    .btn-primary:disabled {
      background: var(--bbva-light-gray);
      cursor: not-allowed;
    }
    .btn-secondary {
      background: transparent;
      color: var(--bbva-blue);
      border: 2px solid var(--bbva-blue);
    }
    .btn-secondary:hover { background: rgba(0,68,129,0.05); }
    .btn-danger {
      background: var(--bbva-error);
      color: var(--bbva-white);
    }
    .btn-danger:hover { background: #c53030; }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    .btn-block { width: 100%; margin-top: 12px; }

    .error-msg {
      background: #FFF5F5;
      color: var(--bbva-error);
      border: 1px solid #FED7D7;
      border-radius: var(--radius);
      padding: 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error-msg.show { display: block; }

    .link-admin {
      display: block;
      margin-top: 24px;
      font-size: 12px;
      color: var(--bbva-gray);
      cursor: pointer;
    }
    .link-admin:hover { color: var(--bbva-blue); }


    @media (max-width: 600px) {
      /* Gana sobre .header-user.visible: en pantallas angostas no hay lugar
         al costado del titulo, se pisaban. */
      .header-user, .header-user.visible { display: none; }
      .header { padding: 16px; }
      .header-logo { font-size: 22px; }
      .registro-card, .admin-login, .confirmacion-card { margin: 24px 12px; padding: 28px 20px; }
      .container { padding: 20px 12px; }
    }
  </style>
